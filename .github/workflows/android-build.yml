name: Android build verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest ships an Android SDK + cmdline-tools. Do not call the
      # archived Android "tools" SDK package (removed upstream).
      - name: Install Android platform 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER" || { echo "sdkmanager missing"; exit 1; }
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      # Standard Gradle from GitHub Actions until launchers/JAR are committed.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile app and run local JVM unit tests
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest --stacktrace --no-daemon
      - name: Upload credential-free debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TrafficScotlandExplorer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      # Building tests does not mean they have run on an Android emulator.
